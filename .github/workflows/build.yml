name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o projecto
        run: |
          unzip -q IphoneExperience-fonte.zip -d src
          ls src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        working-directory: src/IphoneExperience
        run: gradle :app:assembleDebug --stacktrace
      - name: Copiar APK
        run: |
          mkdir -p dist
          cp src/IphoneExperience/app/build/outputs/apk/debug/app-debug.apk dist/IphoneExperience.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IphoneExperience-APK
          path: dist/IphoneExperience.apk
      - name: Publicar numa Release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/IphoneExperience.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
